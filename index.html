<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBusca</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Catálogo de Filmes e Séries</h1>
      <div>
        <select name="categoria" id="categoria">
          <option value="movie">Filmes</option>
          <option value="series">Séries</option>
        </select>
      </div>
      <input type="text" id="busca" placeholder="Buscar por títulos ..." />
      <button id="btn-buscar">Buscar</button>
      <a id="link-favoritos" href="#secao-favoritos">Favoritos (0)</a>
    </header>

    <main>
      <p id="mensagem"></p>
      <div id="resultados"></div>

      <section id="secao-favoritos">
        <div class="cabecalho-favoritos">
          <h2>Meus Favoritos</h2>
          <button id="btn-limpar-favoritos" hidden>Limpar todos</button>
        </div>
        <div id="lista-favoritos"></div>
      </section>
    </main>

    <div id="modal" class="modal">
      <div class="modal-conteudo">
        <button id="fechar-modal" class="fechar-modal">X</button>
        <h3 id="titulo-modal">Atenção</h3>
        <p id="texto-modal">Mensagem</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
